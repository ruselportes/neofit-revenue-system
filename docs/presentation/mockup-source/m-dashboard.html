<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="m.css">
<style>
.sc{position:relative;overflow:hidden;padding:18px 16px 16px;border-radius:16px}
.sc .bar{position:absolute;left:0;right:0;top:0;height:3px}
.sc .p{font-size:11px;color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.sc .v{font-size:20px;font-weight:800;margin-bottom:2px}
.sc .l{font-size:11px;color:#94A3B8}
.sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
</style></head>
<body>
<!--STATUS-->
<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:60px 24px 28px">
  <div><div class="muted" style="font-size:15px">Good morning,</div><div style="font-size:26px;font-weight:800;margin-top:2px">Gym Owner</div></div>
  <div class="card" style="border-radius:12px;padding:4px 16px;font-size:13px;color:#94A3B8;font-weight:500">Sep 26</div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;margin-bottom:24px">
  <div class="card sc"><div class="bar" style="background:#00E5A0"></div><div class="p">Today</div><div class="v" style="color:#00E5A0">₱1,460</div><div class="l">Daily Revenue</div></div>
  <div class="card sc"><div class="bar" style="background:#8B5CF6"></div><div class="p">This Week</div><div class="v" style="color:#8B5CF6">₱8,650</div><div class="l">Weekly Revenue</div></div>

      <path d="M44,12.5 C51.3,18.7 73.3,44.1 88,49.7 C102.7,55.3 117.3,48.2 132,46.2 C146.7,44.1 161.3,38.2 176,37.5 C190.7,36.8 205.3,43.7 220,42.1 C234.7,40.5 250.7,28.2 264,27.8 C277.3,27.4 294.0,37.6 300,39.5" fill="none" stroke="#00E5A0" stroke-width="2.5"/>

    </svg>
  </div>
</div>
<div class="card" style="margin:0 24px;padding:18px 24px">
  <div style="font-size:15px;font-weight:700;margin-bottom:8px">Today's Summary</div>
  <div class="sr"><span class="muted" style="font-size:13px">Total Revenue</span><span style="font-size:17px;font-weight:700;color:#4ADE80">₱1,460</span></div>
  <div class="sr" style="border-bottom:none"><span class="muted" style="font-size:13px">Processed Entries</span><span style="font-size:17px;font-weight:700">12</span></div>

</body></html>
