<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="m.css"></head>
<body style="background:linear-gradient(180deg,#0A0E1A,#111827 50%,#0A0E1A)">
<!--STATUS-->
<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:24px">
  <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:28px">
    <img src="neofit-logo.png" style="width:190px">
    <div class="muted" style="font-size:14px;font-weight:600;margin-top:14px;letter-spacing:.5px">Member Access</div>
  </div>
  <div class="card" style="border-radius:24px;padding:30px">
    <div style="font-size:26px;font-weight:700">Create Your Password</div>
    <div class="muted" style="font-size:13px;margin:4px 0 22px;line-height:19px">You will use your email and this password to sign in next time. Use at least 8 characters.</div>
    <div class="muted" style="font-size:13px;font-weight:600;margin-bottom:6px">New password</div>
    <div style="background:#1E293B;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;font-size:15px;margin-bottom:16px;letter-spacing:3px">••••••••••</div>
    <div class="muted" style="font-size:13px;font-weight:600;margin-bottom:6px">Type it again</div>
    <div style="background:#1E293B;border:1px solid rgba(0,229,160,.6);border-radius:12px;padding:14px 16px;font-size:15px;margin-bottom:16px;letter-spacing:3px">••••••••••</div>
    <div class="grad-btn" style="padding:16px;margin-top:6px">Save Password</div>
    <div style="text-align:center;font-size:12px;color:#64748B;margin-top:14px;line-height:18px">Sign out</div>

  </div>
</div>
</body></html>
