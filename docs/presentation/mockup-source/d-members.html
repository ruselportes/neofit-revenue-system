<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="d.css">
<style>
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:#a1a1aa;font-weight:600;padding:11px 12px;background:#18181b;border-bottom:1px solid #27272a}
td{padding:10px 12px;border-bottom:1px solid #27272a;vertical-align:middle}
.b{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.act{background:rgba(16,185,129,.15);color:#34d399}.exp{background:rgba(239,68,68,.15);color:#f87171}.soon{background:rgba(245,158,11,.15);color:#fbbf24}.pen{background:rgba(161,161,170,.15);color:#d4d4d8}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:10px;vertical-align:middle}
.a{padding:4px 9px;font-size:12px}
</style></head>
<body>
<!--SIDEBAR:members-->
<main class="main">
  <div class="hdr"><div><h2>Member Management</h2><p>View and manage all gym members.</p></div><div class="btn">+ Add New Member</div></div>
  <div style="display:flex;gap:12px;margin-bottom:16px">
    <div style="flex:1;background:#18181b;border:1px solid #27272a;border-radius:8px;padding:10px 14px;font-size:14px;color:#71717a">🔍&nbsp; Search by name or ID...</div>
    <div style="width:200px;background:#18181b;border:1px solid #27272a;border-radius:8px;padding:10px 14px;font-size:14px">All Status ▾</div>
  </div>
  <div class="card" style="overflow:hidden"><table>
    <tr><th>ID</th><th>Name</th><th>Address</th><th>Plan</th><th>Plan Expiry</th><th>Status</th><th>Actions</th></tr>
    <!--MEMBERROWS-->
  </table></div>
</main>
</body></html>
