<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Kalam:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:600px;height:540px;overflow:hidden;background:#0A0E1A}
body{font-family:Inter,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;gap:26px;padding:34px 20px 0}
.paper{width:540px;background:repeating-linear-gradient(180deg,#F4EFE1 0 70px,#B9C7DD 70px 72px);padding:26px 38px 14px;border-radius:8px;transform:rotate(-3deg);box-shadow:0 24px 60px rgba(0,0,0,.55);font-family:Kalam,cursive;font-size:46px;color:#1D3A8A;white-space:nowrap}
.arrow{width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:36px solid #00E5A0;position:relative;margin-top:20px}
.arrow:before{content:"";position:absolute;left:-9px;top:-78px;width:18px;height:44px;background:#00E5A0}
.card{width:540px;background:#131A2B;border:2px solid #00E5A0;border-radius:24px;padding:28px 38px;box-shadow:0 0 60px rgba(0,229,160,.25)}
.row{display:flex;justify-content:space-between;align-items:center}
.n{font-size:42px;font-weight:600;color:#EEF2F7}.a{font-size:50px;font-weight:800;color:#4ADE80}
.s{margin-top:10px;font-size:24px;color:#A9B4C8}
</style></head><body>
<div class="paper">Dimple – 70 – G-Cash</div>
<div class="arrow"></div>
<div class="card"><div class="row"><span class="n">Dimple</span><span class="a">₱70</span></div><div class="s"><span style="color:#00E5A0">✔</span> Read by AI · checked · synced</div></div>
</body></html>
