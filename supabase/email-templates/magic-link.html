<!-- Paste into Supabase: Authentication > Emails > Templates > Magic Link AND Confirm signup. Subject: Your NeoFit sign-in code -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#0A0E1A;font-size:1px;line-height:1px;">Your NeoFit sign-in code is inside.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0A0E1A" style="background-color:#0A0E1A;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding:8px 0 20px 0;font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:bold;letter-spacing:1px;color:#3DDC97;">
            <img src="https://raw.githubusercontent.com/ruselportes/neofit-revenue-system/main/apps/mobile/assets/logo.png" alt="NeoFit" width="170" style="display:block;margin:0 auto;border:0;width:170px;max-width:100%;height:auto;font-size:26px;font-weight:bold;color:#3DDC97;">
          </td>
        </tr>
        <tr>
          <td bgcolor="#131A2B" style="background-color:#131A2B;border:1px solid #243049;border-radius:16px;padding:28px 22px;font-family:Arial,Helvetica,sans-serif;color:#E8ECF6;">
            <p style="margin:0 0 8px 0;font-size:20px;font-weight:bold;color:#FFFFFF;">Your sign-in code</p>
            <p style="margin:0 0 24px 0;font-size:15px;line-height:22px;color:#8A97B5;">
              Type this code in the NeoFit app to sign in.
            </p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#0A0E1A" style="background-color:#0A0E1A;border:1px solid #3DDC97;border-radius:12px;padding:18px 4px 18px 10px;font-family:'Courier New',Courier,monospace;font-size:30px;font-weight:bold;letter-spacing:6px;color:#3DDC97;">{{ .Token }}</td>
              </tr>
            </table>
            <p style="margin:24px 0 0 0;font-size:13px;line-height:20px;color:#8A97B5;">
              The code works for one hour and only once. Never share it with anyone.
              If you did not ask to sign in, you can ignore this email.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 8px 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#6B7794;">
            Sent to {{ .Email }}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
